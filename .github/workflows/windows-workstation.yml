name: Windows workstation simulator

on:
  push:
    branches: [windows-simulator-completion]
  pull_request:
    branches: [main]

jobs:
  windows-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile and import desktop application
        run: |
          python -m compileall -q src/pbrbiosphere
          python -c "from pbrbiosphere.desktop_app import SimulatorApp"
      - name: Run tests
        run: python -m pytest -q
      - name: Run spatial simulator
        run: python -m pbrbiosphere.cli --config examples/configs/flat_panel_demo.json --duration-s 3600 --output-points 13 --output results/ci-demo
      - name: Validate run
        run: python scripts/validate_spatial_run.py results/ci-demo --output results/ci-demo/validation-report.json
      - name: Generate plots
        run: python scripts/plot_spatial_run.py results/ci-demo
